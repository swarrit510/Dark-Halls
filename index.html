let proj, planeLen, colW, cols, zbuf, vig;           // 3D camera settings, filled in by resize()

function resize() {
  cv.width = innerWidth; cv.height = innerHeight;
  const w = cv.width, h = cv.height;
  proj = Math.max(w / 1.8, h * .6);          // distance to the "screen" (controls field of view)
  planeLen = (w / 2) / proj;
  colW = Math.max(2, Math.round(w / [300, 500, 800][cfg.q]));   // each ray draws a strip this wide (bigger = faster, blockier)
  cols = Math.ceil(w / colW);
  zbuf = new Float32Array(cols);             // distance to the wall in each column (so sprites hide behind walls)
  vig = ctx.createRadialGradient(w / 2, h / 2, Math.min(w, h) * .2, w / 2, h / 2, Math.max(w, h) * .75);

/* ============ MAZE (same generator as before) ============ */
function makeMaze() {
  grid = Array.from({ length: H }, () => Array(W).fill(1)); // 1 = wall, 0 = floor
  (function carve(x, y) {
    grid[y][x] = 0;
    [[2, 0], [-2, 0], [0, 2], [0, -2]].sort(() => Math.random() - .5).forEach(([ax, ay]) => {
      const nx = x + ax, ny = y + ay;
      if (nx > 0 && ny > 0 && nx < W - 1 && ny < H - 1 && grid[ny][nx] === 1) {
        grid[y + ay / 2][x + ax / 2] = 0;
        carve(nx, ny);
      }

  })(1, 1);
  for (let i = 0; i < 40; i++) {            // knock out a few walls so you can run in circles
    const x = 1 + Math.floor(Math.random() * (W - 2)), y = 1 + Math.floor(Math.random() * (H - 2));
    if (grid[y][x] === 1 && ((grid[y][x - 1] === 0 && grid[y][x + 1] === 0) ||
                              (grid[y - 1][x] === 0 && grid[y + 1][x] === 0))) grid[y][x] = 0;
  }
}

function start() {

  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++)

  keys = open.slice(0, 3).map(o => ({ x: o.x + .5, y: o.y + .5, ph: Math.random() * 6 }));
  const at = (a, b) => open.slice(a, b).map(o => ({ x: o.x + .5, y: o.y + .5 }));

/* ============ COLLISION ============ */
function solid(x, y) {
  const tx = Math.floor(x), ty = Math.floor(y);
  if (tx === exit.tx && ty === exit.ty && got < 3) return true; // door is locked
  return grid[ty]?.[tx] !== 0;
}
function hits(x, y, r) { return solid(x - r, y - r) || solid(x + r, y - r) || solid(x - r, y + r) || solid(x + r, y + r); }
function randTile() { let x, y; do { x = 1 + Math.random() * (W - 2) | 0; y = 1 + Math.random() * (H - 2) | 0; } while (grid[y][x] !== 0); return { x: x + .5, y: y + .5 }; }

  const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0) / .2);
  for (let i = 1; i < n; i++) { const t = i / n; if (grid[Math.floor(y0 + (y1 - y0) * t)]?.[Math.floor(x0 + (x1 - x0) * t)] !== 0) return false; }
  return true;
}
function payout(win) {
  const base = 5 + Math.min(40, runT / 3 | 0) + got * 15 + pages * 8 + runCoins + (win ? 100 + Math.max(0, 120 - runT | 0) : 0);
  earned = Math.round(base * (1 + Math.min(1, sv.streak * .1)) * [.8, 1, 1.5][cfg.diff]);
  sv.coins += earned; sv.runs++; sv.streak = win ? sv.streak + 1 : 0; saveSv();
}
function stun(t) { enemy.stun = t; enemy.mode = 'chase'; enemy.last = { x: player.x, y: player.y }; enemy.lost = 0; pathT = 0; }
function shove(d) {
  const a = Math.atan2(enemy.y - player.y, enemy.x - player.x);
  for (let i = 0; i < d * 4; i++) { const nx = enemy.x + Math.cos(a) * .25, ny = enemy.y + Math.sin(a) * .25; if (grid[Math.floor(ny)]?.[Math.floor(nx)] !== 0) break; enemy.x = nx; enemy.y = ny; }
}
function dash(n) {
  let x = player.x, y = player.y;
  for (let i = 0; i < n * 10; i++) { const nx = x + Math.cos(player.a) * .1, ny = y + Math.sin(player.a) * .1; if (grid[Math.floor(ny)]?.[Math.floor(nx)] !== 0) break; x = nx; y = ny; }

function botsTick(dt) {

  const lp = AC.createBiquadFilter(), dg = AC.createGain(), lfo = AC.createOscillator(), lg = AC.createGain();   // ambient drone
  lp.type = 'lowpass'; lp.frequency.value = 160; dg.gain.value = .05;
  [41, 41.7].forEach(f => { const o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.connect(lp); o.start(); });
  lfo.frequency.value = .07; lg.gain.value = 70; lfo.connect(lg).connect(lp.frequency); lfo.start();
  lp.connect(dg).connect(master);
  const mo = AC.createOscillator(), mf = AC.createBiquadFilter(), gl = AC.createOscillator(), gg = AC.createGain();   // monster growl
  monG = AC.createGain(); monP = AC.createStereoPanner();
  mo.type = 'sawtooth'; mo.frequency.value = 58; mf.type = 'lowpass'; mf.frequency.value = 220; monG.gain.value = 0;
  gl.frequency.value = 6; gg.gain.value = 12; gl.connect(gg).connect(mo.frequency); gl.start();
  mo.connect(mf).connect(monG).connect(monP).connect(master); mo.start();
}
function tone(f, d, type = 'sine', v = .2, when = 0, slide = 0) {
  if (!AC) return;
  const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
  o.connect(g).connect(master); o.start(t); o.stop(t + d);
}
function noise(d, f, v, q = 1, pan = 0, when = 0) {
  if (!AC) return;
  const t = AC.currentTime + when, src = AC.createBufferSource(), bp = AC.createBiquadFilter(), g = AC.createGain(), p = AC.createStereoPanner();
  src.buffer = noiseBuf; src.loop = true; bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = q; p.pan.value = pan;
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
  src.connect(bp).connect(g).connect(p).connect(master); src.start(t, Math.random()); src.stop(t + d);
}
function thump() { tone(55, .15, 'sine', .5); setTimeout(() => tone(48, .15, 'sine', .4), 160); }
function step() { noise(.09, 220 + Math.random() * 80, .5, .8, (Math.random() - .5) * .2); tone(70, .08, 'sine', .12); }
function chime() { [784, 988, 1319].forEach((f, i) => tone(f, .9, 'triangle', .13, i * .09)); }
function unlockSnd() { tone(60, .6, 'square', .25); noise(.4, 900, .5, 3, 0, .05); tone(220, 1.4, 'sawtooth', .1, .3, 440); }
function scare() { tone(220, .5, 'triangle', .2, 0, 110); }
function winSnd() { [262, 330, 392, 523].forEach((f, i) => tone(f, 2.2, 'triangle', .14, i * .22)); }
function monAudio(dist, dt) {                    // growl gets louder and pans toward the monster; random creaks and whispers
  if (!AC) return;
  const dx = enemy.x - player.x, dy = enemy.y - player.y, lat = -dx * Math.sin(player.a) + dy * Math.cos(player.a);
  monG.gain.setTargetAtTime(Math.max(0, 1 - dist / 10) ** 2 * .45, AC.currentTime, .1);
  monP.pan.setTargetAtTime(Math.max(-1, Math.min(1, lat / (dist || 1))), AC.currentTime, .1);
  if ((creakT -= dt) <= 0) {
    creakT = 6 + Math.random() * 9;
    if (Math.random() < .5) tone(150 + Math.random() * 60, 1.1, 'sawtooth', .04, 0, 90); else noise(1.4, 2500, .05, 6, Math.random() * 2 - 1);
  }
}
function wrap(t, x, y, mw, lh) {                 // draws text that wraps to a max width, returns next y
  let line = '';
  for (const wd of t.split(' ')) {
    const tt = line + wd + ' ';
    if (ctx.measureText(tt).width > mw && line) { ctx.fillText(line, x, y); y += lh; line = wd + ' '; } else line = tt;
  }
  ctx.fillText(line, x, y); return y + lh;
}
function toMenu() { room?.presence({ ar: 0, hp: 0 }); state = 'menu'; try { document.exitPointerLock(); } catch (e) {} }
function saveCfg() { try { localStorage.setItem('dh_cfg', JSON.stringify(cfg)); } catch (e) {} }
function uiClick(x, y) { for (const b of btns) if (x > b.x && x < b.x + b.w && y > b.y && y < b.y + b.h) { b.f(); saveCfg(); saveSv(); return; } }
function tapUI(x, y) {
  if (state === 'menu' || state === 'settings' || state === 'store' || state === 'forge' || state === 'arena') { uiClick(x, y); return true; }
  if ((state === 'pause' || state === 'dead' || state === 'win') && x > innerWidth - 110 && y < 60) { toMenu(); return true; }
  return false;
}
function nearSpot() { return spots.find(p => Math.hypot(p.x - player.x, p.y - player.y) < 1); }
function toggleHide() {
  if (hid) { hid = null; noise(.3, 400, .3); return; }
  const p = nearSpot(); if (!p) return;
  if (enemy.mode === 'chase' && Math.hypot(enemy.x - player.x, enemy.y - player.y) < D().sight && canSee(enemy.x, enemy.y, player.x, player.y)) { say("He's watching you. You can't hide!", 2); return; }
  hid = p; player.x = p.x; player.y = p.y; noise(.3, 400, .3);
}
addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
function drawMenu(w, h) {                          // title, settings and character store
  btns = [];
  ctx.fillStyle = 'rgba(0,0,0,.84)'; ctx.fillRect(0, 0, w, h);
  const st = state === 'store', fg = state === 'forge', many = st || fg, sx = w / 2, bw = Math.min(many ? 440 : 320, w * .9), bh = Math.min(fg ? 34 : 40, h / (fg ? 16 : st ? 13 : 14));
  let y = h * (fg ? .2 : st ? .27 : .3); ctx.textAlign = 'center';
  ctx.fillStyle = '#b02020'; ctx.font = 'bold ' + Math.min(st ? 44 : 64, w / 9) + 'px Georgia, serif'; ctx.fillText(state === 'arena' ? 'ARENA' : fg ? 'HERO FORGE' : st ? 'STORE' : state === 'menu' ? 'DARK HALLS' : 'SETTINGS', sx, y - bh * 1.2);
  ctx.fillStyle = many ? '#f1c40f' : '#8a8478'; ctx.font = (many ? '' : 'italic ') + Math.min(18, w / 26) + (many ? 'px monospace' : 'px Georgia, serif'); ctx.fillText(many ? 'Coins: ' + sv.coins : state === 'menu' ? 'Escape Runs   |   Coins: ' + sv.coins : '', sx, y - bh * .55);
  const own = c => sv.owned.includes(c.id) || c.id === 'custom';
  const items = state === 'arena' ? ARENA() : fg ? FORGE() : st ? STORECH().map(c => [c.n + ' · ' + c.ab + '  ' + (own(c) ? (sv.sel === c.id ? 'EQUIPPED' : 'OWNED') : c.cost + 'c'), () => {
      if (own(c)) { sv.sel = c.id; storeMsg = ''; } else if (sv.coins >= c.cost) { sv.coins -= c.cost; sv.owned.push(c.id); sv.sel = c.id; storeMsg = 'Unlocked ' + c.n + '!'; tone(880, .15, 'square', .1); } else storeMsg = 'Not enough coins. Escape more runs!';
    }]).concat([['Back', () => state = bk()]])
    : state === 'menu' ? [['PLAY: Maze Escape', () => begin()], ['PLAY: Arena (vs bots)', () => state = 'arena'], ['Character: ' + CHR().n, () => state = 'store'], ['Hero Forge (custom hero)', () => state = 'forge'], ['Difficulty: ' + D().n, () => cfg.diff = (cfg.diff + 1) % 3], ['Settings', () => state = 'settings']]
    : [['Volume: ' + Math.round(cfg.vol * 100) + '%', () => { cfg.vol = cfg.vol >= 1 ? 0 : Math.round((cfg.vol + .2) * 10) / 10; if (master) master.gain.value = cfg.vol; }],
       ['Look speed: ' + cfg.sens + 'x', () => cfg.sens = SENS[(SENS.indexOf(cfg.sens) + 1) % SENS.length]],
       ['Graphics: ' + ['Low', 'Medium', 'High'][cfg.q], () => { cfg.q = (cfg.q + 1) % 3; resize(); }],
       ['Back', () => state = 'menu']];
  let hov = -1;
  items.forEach(([t, f], i) => {
    const on = mx > sx - bw / 2 && mx < sx + bw / 2 && my > y && my < y + bh; if (on) hov = i;
    ctx.fillStyle = on ? 'rgba(140,30,30,.9)' : 'rgba(30,30,36,.9)'; ctx.fillRect(sx - bw / 2, y, bw, bh);
    ctx.strokeStyle = st && STORECH()[i] && sv.sel === STORECH()[i].id ? '#d4a017' : '#5a1a1a'; ctx.lineWidth = 2; ctx.strokeRect(sx - bw / 2, y, bw, bh);
    ctx.fillStyle = '#ddd'; ctx.font = Math.min(bh * .42, bw * .94 / (t.length * .6)) + 'px monospace'; ctx.fillText(t, sx, y + bh * .64);
    btns.push({ x: sx - bw / 2, y, w: bw, h: bh, f }); y += bh * 1.28;
  });
  ctx.fillStyle = '#9a9488'; ctx.font = Math.min(13, w / 34) + 'px monospace';
  if (st) { const c = STORECH()[hov] || CHR(); wrap(c.d, sx, y + 8, bw, 18); if (storeMsg) { ctx.fillStyle = '#e8c860'; ctx.fillText(storeMsg, sx, y + 56); } }
  else if (state === 'arena') wrap('Bot matches pay more coins on higher difficulties. Your custom hero fights here too.', sx, y + 6, bw, 17);
  else if (fg) { ctx.fillText(sv.custom ? 'Gun, ability and upgrades only matter in Arena battles (ability also works in the maze).' : 'Build your own hero: pick a gun, ability and color, then upgrade it with coins.', sx, y + 6); if (storeMsg) { ctx.fillStyle = '#e8c860'; ctx.fillText(storeMsg, sx, y + 28); } }
  else if (state === 'menu') {
    ctx.fillText(D().d, sx, y + 6);
    ctx.fillText('WASD move, Shift sprint, H hide, F ability, click shoots (Arena)', sx, y + 30);
    ctx.fillText('Phone: left stick moves (push far = sprint), ability button above HIDE', sx, y + 48);
  } else ctx.fillText('Changes save automatically.', sx, y + 6);
}
function begin() {                               // menu -> story pages -> game
  if (state === 'menu') { if (sv.seen) start(); else { sv.seen = 1; state = 'intro'; introI = 0; introT = 0; } }
  else if (state === 'intro') { if (++introI >= INTRO.length) start(); else introT = 0; }
  else if (mode === 'pvp') startArena(); else start();
}

/* ============ INPUT + GAME LOOP ============ */
function lock() { try { const p = cv.requestPointerLock && cv.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
addEventListener('keydown', e => { held[e.key.toLowerCase()] = 1; if (state === 'play' && !e.repeat && (e.key === 'h' || e.key === ' ')) toggleHide(); if (state === 'play' && !e.repeat && (e.key === 'q' || e.key === 'f')) useAbility(); if (e.key === 'm' && (state === 'pause' || state === 'dead' || state === 'win')) toMenu(); if (e.key === 'b' && state === 'play') toMenu(); if (e.key.startsWith('Arrow')) e.preventDefault(); });
addEventListener('keyup', e => delete held[e.key.toLowerCase()]);
addEventListener('blur', () => { held = {}; if (state === 'play') state = 'pause'; });
addEventListener('mousemove', e => {                         // mouse look (pointer is locked to the game)
  if (state !== 'play') return;
  if (document.pointerLockElement === cv) player.a += e.movementX * .0022 * cfg.sens;
  else if (e.buttons & 1) player.a += e.movementX * .004 * cfg.sens;    // fallback: drag to look if pointer lock isn't available
});
addEventListener('mousedown', e => {
  initAudio();
  if (state === 'play') { if (!touchMode && document.pointerLockElement !== cv) lock(); return; }
  if (tapUI(e.clientX, e.clientY)) return;
  if (state === 'pause') state = 'play'; else begin();
  lock();
});
document.addEventListener('pointerlockchange', () => {      // Esc releases the mouse -> pause
  if (!document.pointerLockElement && state === 'play' && !touchMode) state = 'pause';
});

/* touch: left half of the screen = joystick, right half = drag to look around */
addEventListener('touchstart', e => {
  e.preventDefault(); initAudio(); touchMode = true;
  if (state !== 'play') { if (tapUI(e.changedTouches[0].clientX, e.changedTouches[0].clientY)) return; if (state === 'pause') state = 'play'; else begin(); return; }
  for (const t of e.changedTouches) {
    if (t.clientX > innerWidth - 120 && t.clientY < innerHeight - 140 && t.clientY > innerHeight - 240) { useAbility(); continue; }
    if (t.clientX > innerWidth - 120 && t.clientY > innerHeight - 140 && (hid || nearSpot())) { toggleHide(); continue; }
    if (t.clientX < innerWidth / 2 && !joy) joy = { id: t.identifier, ox: t.clientX, oy: t.clientY, x: t.clientX, y: t.clientY };
    else if (t.clientX >= innerWidth / 2 && !aim) aim = { id: t.identifier, lx: t.clientX };
  }
}, { passive: false });
addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (joy && t.identifier === joy.id) { joy.x = t.clientX; joy.y = t.clientY; }
    if (aim && t.identifier === aim.id) { if (state === 'play') player.a += (t.clientX - aim.lx) * .007 * cfg.sens; aim.lx = t.clientX; }
  }
}, { passive: false });
function touchEnd(e) {
  for (const t of e.changedTouches) {
    if (joy && t.identifier === joy.id) joy = null;
    if (aim && t.identifier === aim.id) aim = null;
  }
}
addEventListener('touchend', touchEnd); addEventListener('touchcancel', touchEnd);

start(); state = 'menu';
let last = performance.now();
(function loop(t) {
  const dt = Math.min(.05, (t - last) / 1000); last = t; time = t / 1000;
  if (state === 'play') update(dt); else { if (monG) monG.gain.value = 0; if (state === 'intro') introT += dt; }
  draw();
  requestAnimationFrame(loop);
})(last);
</script>
